<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>IronLog - 健身訓練記錄</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IronLog">
  <meta name="theme-color" content="#121214">

  <!-- 動態生成 PWA Manifest -->
  <script>
    const manifest = {
      name: "IronLog 健身組數記錄",
      short_name: "IronLog",
      start_url: "./index.html",
      display: "standalone",
      background_color: "#121214",
      theme_color: "#121214",
      icons: [
        {
          src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121214'/><text y='68' x='50' font-size='60' text-anchor='middle'>🏋️</text></svg>",
          sizes: "192x192 512x512",
          type: "image/svg+xml"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <style>
    :root {
      --bg-primary: #121214;
      --bg-secondary: #1c1c1e;
      --bg-tertiary: #2c2c2e;
      --accent: #30d158;
      --accent-dim: rgba(48, 209, 88, 0.15);
      --text-main: #f5f5f7;
      --text-muted: #8e8e93;
      --danger: #ff453a;
      --border-color: #38383a;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 70px);
      overflow-x: hidden;
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(28, 28, 30, 0.8);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .card {
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
      font-weight: 600;
    }

    select, input, button {
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-tertiary);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }
